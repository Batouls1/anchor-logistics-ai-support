services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: anchor_logistics
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:devpassword@db:5432/anchor_logistics
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - audio_data:/app/static/audio
      - bm25_store:/app/rag/bm25_store

volumes:
  postgres_data:
  audio_data:
  bm25_store: