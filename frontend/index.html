<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anchor Logistics — Support</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="chat-app">

  <header class="chat-header">
    <div class="chat-header-inner">
      <div class="avatar">AL</div>
      <div class="header-info">
        <p class="header-name">Anchor Logistics support</p>
        <p class="header-status"><span class="status-dot"></span>Online</p>
      </div>
      <button class="icon-btn" aria-label="More options">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
      </button>
    </div>
  </header>

  <main class="chat-body" id="chatBody">
    <div class="message-stack" id="messageStack">
      <div class="bubble assistant">
        Hi, I'm Anchor Logistics' assistant. Ask me about orders, shipping, or returns.
      </div>
    </div>
  </main>

  <footer class="chat-input-row">
    <div class="chat-input-inner">
      <div class="text-field" id="textField" contenteditable="true" role="textbox" aria-label="Type a message" data-placeholder="Type a message"></div>
      <button class="round-btn mic-btn" id="micBtn" aria-label="Record voice note">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4"/></svg>
      </button>
      <button class="round-btn send-btn" id="sendBtn" aria-label="Send message">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </footer>

</div>

<script src="app.js"></script>
</body>
</html>
