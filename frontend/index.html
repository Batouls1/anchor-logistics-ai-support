<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anchor Logistics — Support</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="host-page">
  <div class="host-page-content">
    <div class="host-logo">Anchor Logistics</div>
    <p class="host-hint">This is where your website content would sit. The support widget floats in the corner, same as it would on any live page.</p>
  </div>
</div>

<div class="chat-widget open" id="chatWidget">

  <header class="chat-header">
    <div class="header-left">
      <div class="avatar" aria-hidden="true">AL</div>
      <div class="header-info">
        <p class="header-name">Anchor Logistics</p>
        <p class="header-status"><span class="status-dot" aria-hidden="true"></span>Online now</p>
      </div>
    </div>
    <div class="header-right">
      <button class="live-call-btn" id="liveCallBtn" aria-label="Start a live call with support">
        <i class="icon-phone" aria-hidden="true"></i>
        <span>Live call</span>
      </button>
      <button class="icon-btn" id="minimizeBtn" aria-label="Minimize chat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  </header>

  <div class="connection-banner" id="connectionBanner" role="alert">
    Unable to connect to support. Please refresh the page.
  </div>

  <main class="chat-body" id="chatBody">
    <div class="message-stack" id="messageStack" role="log" aria-live="polite" aria-relevant="additions" aria-label="Conversation">
      <div class="bubble assistant connecting" id="connectingBubble">
        <span class="typing-indicator-inline" aria-hidden="true"><span></span><span></span><span></span></span>
        Connecting...
      </div>
    </div>
  </main>

  <footer class="chat-input-row">
    <div class="text-field" id="textField" contenteditable="true" role="textbox" aria-label="Type a message" aria-multiline="false" data-placeholder="Type a message" tabindex="0"></div>
    <button class="round-btn mic-btn" id="micBtn" aria-label="Record voice note">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4"/></svg>
    </button>
    <button class="round-btn send-btn" id="sendBtn" aria-label="Send message">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </footer>

</div>

<button class="launcher-btn" id="launcherBtn" aria-label="Open support chat">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
</button>

<script src="app.js"></script>
</body>
</html>
